server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy /api requests to backend if they are hosted on the same domain, 
    # but on Railway they are often different domains. 
    # We will rely on VITE_API_URL being set during build.
}
